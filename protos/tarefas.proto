syntax = "proto3";

package tarefas;

service TarefaService {
  rpc CriarTarefa (CriarTarefaRequest) returns (Tarefa);
  rpc ListarTarefas (Vazio) returns (ListaTarefas);
  rpc AtualizarTarefa (Tarefa) returns (Tarefa);
  rpc DeletarTarefa (DeletarTarefaRequest) returns (DeletarTarefaResponse);
}

message Tarefa {
  string id = 1;
  string titulo = 2;
  string descricao = 3;
  string status = 4;
  string data_limite = 5;
  repeated string responsaveis = 6;
}

message CriarTarefaRequest {
  string titulo = 1;
  string descricao = 2;
  string status = 3;
  string data_limite = 4;
  repeated string responsaveis = 5;
}

message Vazio {}

message ListaTarefas {
  repeated Tarefa tarefas = 1;
}

message DeletarTarefaRequest {
  string id = 1;
}

message DeletarTarefaResponse {
  bool sucesso = 1;
  string mensagem = 2;
}